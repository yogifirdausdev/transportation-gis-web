services:
  db:
    platform: linux/amd64
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gis:gis@db:5432/gis
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:-replace-this-with-a-long-random-secret-123456789}
      NUXT_ADMIN_EMAIL: ${NUXT_ADMIN_EMAIL:-admin@dishub.local}
      NUXT_ADMIN_PASSWORD: ${NUXT_ADMIN_PASSWORD:-ChangeThisPassword123!}
      NUXT_DATA_DIR: /app/data
      NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME:-Transportation GIS}
      NUXT_PUBLIC_MAP_CENTER_LAT: ${NUXT_PUBLIC_MAP_CENTER_LAT:--6.1754}
      NUXT_PUBLIC_MAP_CENTER_LNG: ${NUXT_PUBLIC_MAP_CENTER_LNG:-106.8272}
      NUXT_PUBLIC_MAP_ZOOM: ${NUXT_PUBLIC_MAP_ZOOM:-12}
    ports:
      - "3000:3000"
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
