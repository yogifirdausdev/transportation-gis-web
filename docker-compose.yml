services:
  db:
    build:
      context: ./docker/postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
    volumes:
      - gis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-gis}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gis

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://gis:gis@db:5432/gis}
      STORAGE_DIR: /app/storage
    volumes:
      - gis_storage:/app/storage
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gis

volumes:
  gis_pgdata:
  gis_storage:

networks:
  gis:
    name: transportation-gis
