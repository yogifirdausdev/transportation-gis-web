# Include inside the WordPress site's HTTPS server { } block, ABOVE its "location /" block:
#   include /etc/nginx/snippets/peta-perlengkapan-jalan.locations.conf;
#
# The app must run with NUXT_APP_BASE_URL=/peta-perlengkapan-jalan/ and listen on 127.0.0.1:3000.
# proxy_pass has no trailing path on purpose: the app expects to receive the full
# /peta-perlengkapan-jalan/... path.

# Add the missing trailing slash.
location = /peta-perlengkapan-jalan {
    return 301 /peta-perlengkapan-jalan/;
}

# Login: rate-limited (zone defined in /etc/nginx/conf.d/peta-ratelimit.conf).
location = /peta-perlengkapan-jalan/api/auth/login {
    limit_req zone=peta_login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else under the sub-path. "^~" makes this win over WordPress's
# regex rules for .js/.css/.png files, which would otherwise answer with a 404.
location ^~ /peta-perlengkapan-jalan/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Excel imports with embedded photos (the app itself caps them at 30 MB).
    client_max_body_size 32m;
    # Large imports can take a while to validate and save.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
